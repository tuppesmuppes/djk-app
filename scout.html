.lgsvg .lgo{fill:none;stroke:#1d2330;stroke-width:1;stroke-dasharray:1.5 1}.lgsvg .lgon{font-size:4.5px;fill:#1d2330;text-anchor:middle;font-weight:700}
.lgsvg .lgb{font-size:4px;fill:var(--ink);text-anchor:middle}

<body>
<header><h1>🏐 Volleyball Scouting</h1><nav id="nav"></nav><button id="syncBadge" class="badge" data-act="tab" data-k="data"></button></header>
<main id="app"></main>
<div id="modal" class="modal hidden"></div>
<script>
'use strict';
/* ---------- Konstanten ---------- */
const KEY = 'vbscout_v1';
const SK = {S:'Aufschlag', R:'Annahme', E:'Zuspiel', A:'Angriff', B:'Block', D:'Abwehr'};
const SKILLS = ['S','R','E','A','B','D'];
const RT = ['#','+','!','-','/','='];
const RL = {
  S:['Ass','Gegner unter Druck','Gegner Annahme mittel','Gegner gute Annahme','Gegner perfekte Annahme','Fehler'],
  R:['Perfekt','Gut','Mittel','Schlecht','Overpass','Fehler (Ass)'],
  E:['Perfekt','Gut','Ok','Schlecht','Sehr schlecht','Fehler'],
  A:['Punkt','Gut','Abgewehrt','Schlecht','Geblockt','Fehler'],
  B:['Punkt','Gut (Abwehr leicht)','Neutral (Ball im Spiel)','Schlecht (Angreifer frei)','Block-out','Fehler'],
  D:['Perfekt','Gut','Ok','Schlecht','Kaum spielbar','Fehler']
};
// Welche Bewertung beendet den Ballwechsel zu wessen Gunsten
const POINT = {
  S:{'#':'us','=':'them'}, R:{'=':'them'}, E:{'=':'them'},
  A:{'#':'us','/':'them','=':'them'}, B:{'#':'us','/':'them','=':'them'}, D:{'=':'them'}
};
const POS = {Z:'Zuspiel', AA:'Außen', D:'Diagonal', MB:'Mitte', L:'Libero', U:'Universal'};
const ZN = ['I','II','III','IV','V','VI'];
const COURT_ORDER = [3,2,1,4,5,0]; // Anzeige: IV III II / V VI I
const RCOL = ['#1a9e55','#6dbb5f','#8b94a5','#ef9a22','#e0662f','#d0342c'];

/* ---------- Speicher ---------- */
function load(){
  try { const s = localStorage.getItem(KEY); if (s) return JSON.parse(s); } catch(e) {}
  return {teams:[], matches:[]};
}
function persist(){
  try { localStorage.setItem(KEY, JSON.stringify(db)); }
  catch(e) { alert('Speichern im Browser fehlgeschlagen: ' + e.message + '\nBitte unter "Daten" eine Sicherung herunterladen.'); }
}
function save(){ stamp(); persist(); schedulePush(); }
let db = load();
if (!db.tomb) db.tomb = [];

/* ---------- Online-Sync (Supabase) ----------
   Jedes Team und jedes Spiel ist ein Datensatz mit Zeitstempel (upd). Der neuere Stand gewinnt.
   Gelöschte Datensätze werden als {"deleted": true} übertragen, damit andere Geräte sie ebenfalls entfernen. */
const SYNC_KEY = 'vbscout_sync';
let sync = (() => { try { return JSON.parse(localStorage.getItem(SYNC_KEY)) || {}; } catch(e) { return {}; } })();
if (!sync.pushed) sync.pushed = {};
// Supabase-Projekt fest hinterlegt (öffentliche Werte wie in den anderen DJK-Apps); eigene Eingaben unter „Daten“ haben Vorrang
const DEFAULT_SUPA = {
  url: 'https://pgftkscaubdqprdvwvmt.supabase.co',
  key: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBnZnRrc2NhdWJkcXByZHZ3dm10Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgzMjcyODAsImV4cCI6MjA5MzkwMzI4MH0.pvUMfEMCxwKjBDc3yJ4pG2wcgdElmcjxWeAzMlMxYzU'
};
if (!sync.url) sync.url = DEFAULT_SUPA.url;
if (!sync.key) sync.key = DEFAULT_SUPA.key;
// Geräte-Link: …/scout.html#k=SYNC-SCHLÜSSEL übernimmt den Schlüssel einmalig und entfernt ihn aus der Adresszeile
(() => {
  const k = new URLSearchParams(location.hash.slice(1)).get('k');
  if (k && k.length >= 24) {
    if (sync.space !== k) { sync.space = k; sync.pushed = {}; }
    try { localStorage.setItem('vbscout_sync', JSON.stringify(sync)); } catch(e) {}
    history.replaceState(null, '', location.pathname + location.search);
  }
})();
const syncState = {status: 'idle', msg: '', last: null};
const saveSync = () => { try { localStorage.setItem(SYNC_KEY, JSON.stringify(sync)); } catch(e) {} };
const syncOn = () => !!(sync.url && sync.key && sync.space);
const lastJson = new Map();
const bodyOf = d => { const {upd, ...rest} = d; return rest; };
const allDocs = () => [...db.teams.map(d => ['team', d]), ...db.matches.map(d => ['match', d])];
allDocs().forEach(([, d]) => { if (!d.upd) d.upd = 1; lastJson.set(d.id, JSON.stringify(bodyOf(d))); });
function stamp(){
  const now = Date.now();
  for (const [, d] of allDocs()) {
    const j = JSON.stringify(bodyOf(d));
    if (lastJson.get(d.id) !== j) { lastJson.set(d.id, j); d.upd = now; }
  }
}
function markDeleted(kind, id){
  db.tomb = db.tomb.filter(x => x.id !== id);
  db.tomb.push({id, kind, upd: Date.now()});
  lastJson.delete(id);
}
async function rpc(fn, body){
  const h = {'Content-Type': 'application/json', apikey: sync.key};
  if (sync.key.startsWith('eyJ')) h.Authorization = 'Bearer ' + sync.key; // ältere anon-Keys (JWT)
  const r = await fetch(sync.url.replace(/\/+$/, '') + '/rest/v1/rpc/' + fn, {method: 'POST', headers: h, body: JSON.stringify(body)});
  const txt = await r.text();
  if (!r.ok) {
    let m = txt; try { const j = JSON.parse(txt); m = j.message || j.msg || j.error || txt; } catch(e) {}
    throw new Error('HTTP ' + r.status + ': ' + String(m).slice(0, 200));
  }
  return txt ? JSON.parse(txt) : null;
}
function setSync(status, msg){
  syncState.status = status; syncState.msg = msg || '';
  if (status === 'ok') syncState.last = new Date();
  renderSyncBadge();
  if (ui.tab === 'data') { const el = document.getElementById('syncInfo'); if (el) el.innerHTML = syncInfoHtml(); }
}
let pushTimer = null, pushing = false, retryTimer = null;
function schedulePush(){
  if (!syncOn()) return;
  clearTimeout(pushTimer);
  pushTimer = setTimeout(pushNow, 700);
}
async function pushNow(){
  if (!syncOn()) return;
  if (pushing) { schedulePush(); return; }
  const rows = allDocs().filter(([, d]) => (sync.pushed[d.id] || 0) < d.upd)
    .map(([kind, d]) => ({id: d.id, kind, data: bodyOf(d), updated_at: d.upd}));
  db.tomb.filter(x => (sync.pushed[x.id] || 0) < x.upd)
    .forEach(x => rows.push({id: x.id, kind: x.kind, data: {deleted: true}, updated_at: x.upd}));
  if (!rows.length) { if (syncState.status !== 'err') setSync('ok'); return; }
  pushing = true; setSync('busy', 'speichert …');
  try {
    await rpc('scout_push', {p_space: sync.space, p_rows: rows});
    rows.forEach(r => sync.pushed[r.id] = r.updated_at);
    saveSync(); setSync('ok');
  } catch (e) {
    setSync('err', e.message);
    clearTimeout(retryTimer); retryTimer = setTimeout(pushNow, 30000);
  } finally { pushing = false; }
}
async function pullNow(){
  if (!syncOn()) return;
  setSync('busy', 'lädt …');
  let rows;
  try { rows = await rpc('scout_pull', {p_space: sync.space}) || []; }
  catch (e) { setSync('err', e.message); return; }
  const tomb = new Map(db.tomb.map(x => [x.id, x]));
  let changed = false;
  for (const r of rows) {
    const arr = r.kind === 'team' ? db.teams : db.matches;
    const i = arr.findIndex(d => d.id === r.id);
    const localT = i >= 0 ? (arr[i].upd || 0) : ((tomb.get(r.id) || {}).upd || 0);
    if (r.updated_at > localT) {
      if (r.data && r.data.deleted) {
        if (i >= 0) arr.splice(i, 1);
        tomb.set(r.id, {id: r.id, kind: r.kind, upd: r.updated_at});
        lastJson.delete(r.id);
      } else {
        const d = {...r.data, upd: r.updated_at};
        if (i >= 0) arr[i] = d; else arr.push(d);
        tomb.delete(r.id);
        lastJson.set(r.id, JSON.stringify(bodyOf(d)));
      }
      changed = true;
    }
    sync.pushed[r.id] = Math.max(sync.pushed[r.id] || 0, r.updated_at);
  }
  db.tomb = [...tomb.values()];
  saveSync();
  if (changed) {
    persist();
    if (!team(ui.editTeam)) ui.editTeam = db.teams[0] ? db.teams[0].id : null;
    if (!team(ui.f.team)) { ui.f.team = db.teams[0] ? db.teams[0].id : null; ui.f.match = 'all'; }
    if (ui.f.match !== 'all' && !match(ui.f.match)) ui.f.match = 'all';
    if (ui.matchId && !match(ui.matchId)) ui.matchId = null;
    if ($modal.classList.contains('hidden')) render();
  }
  setSync('ok');
  pushNow();
}
function renderSyncBadge(){
  const el = document.getElementById('syncBadge'); if (!el) return;
  if (!syncOn()) { el.textContent = '💾 nur lokal'; el.title = 'Online-Speicherung unter „Daten“ einrichten'; el.className = 'badge'; return; }
  const map = {idle: ['☁ verbunden', ''], busy: ['☁ ' + syncState.msg, ''], ok: ['☁ gespeichert', 'ok'], err: ['⚠ Sync-Fehler', 'err']};
  const [txt, cls] = map[syncState.status] || map.idle;
  el.textContent = txt; el.className = 'badge ' + cls;
  el.title = syncState.status === 'err' ? syncState.msg + ' – Daten bleiben lokal gespeichert, neuer Versuch automatisch.' : '';
}
function newSpace(){
  const a = new Uint8Array(24); crypto.getRandomValues(a);
  return Array.from(a, b => 'abcdefghijkmnpqrstuvwxyz23456789'[b % 32]).join('');
}
const SETUP_SQL = `-- Volleyball Scouting: Online-Speicher in Supabase
-- Einmal im Supabase-Dashboard im SQL Editor ausführen.
-- Legt nur die Tabelle scout_store und zwei Funktionen an; bestehende Tabellen bleiben unberührt.

create table if not exists public.scout_store (
  space      text   not null,              -- Sync-Schlüssel (geheim, mind. 24 Zeichen)
  id         text   not null,              -- ID des Teams bzw. Spiels
  kind       text   not null check (kind in ('team', 'match')),
  data       jsonb  not null,              -- Inhalt; {"deleted": true} = gelöscht
  updated_at bigint not null,              -- Zeitstempel der letzten Änderung (ms)
  primary key (space, id)
);

-- Kein direkter Zugriff auf die Tabelle: RLS an, keine Policies.
alter table public.scout_store enable row level security;
revoke all on table public.scout_store from anon, authenticated;

-- Lesen: nur Zeilen mit passendem Sync-Schlüssel
create or replace function public.scout_pull(p_space text)
returns setof public.scout_store
language sql
security definer
set search_path = public
as $$
  select * from public.scout_store
  where space = p_space and length(p_space) >= 24;
$$;

-- Schreiben: neuere Stände überschreiben ältere
create or replace function public.scout_push(p_space text, p_rows jsonb)
returns void
language plpgsql
security definer
set search_path = public
as $$
begin
  if p_space is null or length(p_space) < 24 then
    raise exception 'Sync-Schlüssel zu kurz';
  end if;
  insert into public.scout_store (space, id, kind, data, updated_at)
  select p_space, r->>'id', r->>'kind', r->'data', (r->>'updated_at')::bigint
  from jsonb_array_elements(p_rows) as r
  on conflict (space, id) do update
    set kind = excluded.kind, data = excluded.data, updated_at = excluded.updated_at
    where public.scout_store.updated_at <= excluded.updated_at;
end;
$$;

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const team = id => db.teams.find(t => t.id === id);
const match = id => db.matches.find(m => m.id === id);
const today = () => new Date().toISOString().slice(0,10);
const fmtDate = d => d ? d.split('-').reverse().join('.') : '';
function playerOf(t, id){ return t && t.players.find(p => p.id === id); }
function pname(t, id, short){
  const p = playerOf(t, id);
  if (!p) return 'Gelöschter Spieler';
  return short ? '#' + p.num : '#' + p.num + ' ' + p.name;
}
const pct = (a, n) => n ? Math.round(a / n * 100) + '%' : '–';

/* ---------- UI-Zustand ---------- */

};

/* ---------- Formationen (5-1-System, 3er-Annahme) ---------- */
// Koordinaten im eigenen Halbfeld: x 0 = linke, 1 = rechte Seitenlinie (Blick zum Netz), y 0 = Netz, 1 = Grundlinie.
// Annahme-Formation je Rotation (P = Zone des Zuspielers); Schlüssel = Rotationszone. Alle Formationen halten die
// Überschneidungsregeln für die annehmende Mannschaft ein (I hinter II, VI hinter III, V hinter IV; links-rechts je Reihe).
const REC = {
  1:{4:[.15,.1], 3:[.5,.1],  2:[.8,.55], 5:[.2,.6],  6:[.5,.62], 1:[.92,.88]},
  2:{4:[.1,.08], 3:[.25,.5], 2:[.85,.08],5:[.08,.88],6:[.5,.62], 1:[.82,.6]},
  3:{4:[.15,.5], 3:[.55,.08],2:[.85,.08],5:[.4,.62], 6:[.55,.9], 1:[.8,.6]},
  4:{4:[.08,.08], 3:[.17,.28],2:[.22,.56], 5:[.47,.64], 6:[.73,.64], 1:[.92,.9]},  // vorderer Außen (II) nimmt links an, Zuspieler und Mitte stehen links am Netz
  5:{4:[.1,.08], 3:[.22,.5], 2:[.85,.1], 5:[.12,.3], 6:[.5,.65], 1:[.82,.6]},
  6:{4:[.15,.5], 3:[.6,.1],  2:[.85,.1], 5:[.45,.62],6:[.65,.3], 1:[.8,.62]}
};
// 4er-Annahme Jugend (U16) aus der Läufer-App übernommen; L5/L6: Zuspielerin leicht nach links korrigiert (Überschneidungsregel)
const REC4 = {
  1:{4:[0.06,0.41], 3:[0.53,0.16], 2:[0.895,0.635], 5:[0.265,0.6], 6:[0.55,0.72], 1:[0.96,0.77]},
  2:{4:[0.04,0.25], 3:[0.215,0.61], 2:[0.7,0.13], 5:[0.36,0.75], 6:[0.58,0.72], 1:[0.76,0.67]},
  3:{4:[0.21,0.62], 3:[0.69,0.09], 2:[0.785,0.3], 5:[0.44,0.7], 6:[0.635,0.73], 1:[0.81,0.69]},
  4:{4:[0.087,0.084], 3:[0.13,0.31], 2:[0.23,0.59], 5:[0.42,0.7], 6:[0.62,0.71], 1:[0.845,0.68]},
  5:{4:[0.044,0.23], 3:[0.145,0.64], 2:[0.88,0.625], 5:[0.37,0.33], 6:[0.41,0.735], 1:[0.68,0.695]},
  6:{4:[0.156,0.645], 3:[0.837,0.09], 2:[0.873,0.64], 5:[0.372,0.75], 6:[0.6,0.23], 1:[0.648,0.71]}
};
// Spezialpositionen: vorne Außen IV, Mitte III, Zuspiel/Diagonal II; hinten Zuspiel/Diagonal I, Außen VI, Libero/Mitte V
const SPOT = {4:[.17,.12], 3:[.5,.12], 2:[.83,.12], 5:[.17,.75], 6:[.5,.8], 1:[.83,.75]};
const SERVER_SPOT = [.85,1.1];
const STD_ORDER = ['Z','AA','MB','D','AA','MB']; // ab Zuspieler in Zonenreihenfolge I → II → III …
const posOf = (t, id) => (playerOf(t, id) || {}).pos;
// Ein als normaler Spieler eingewechselter Libero (Position L in der regulären Aufstellung) spielt die Rolle der Mitte
const roleOf = (t, id) => { const p = posOf(t, id); return p === 'L' ? 'MB' : p; };
function isStd51(lineup, t){
  const pos = lineup.map(id => roleOf(t, id)), s = pos.indexOf('Z');
  return s >= 0 && STD_ORDER.every((r, k) => pos[(s + k) % 6] === r);
}
function specZone(pos, front){
  if (front) return pos === 'AA' ? 4 : pos === 'MB' ? 3 : 2;
  return pos === 'AA' ? 6 : (pos === 'MB' || pos === 'L') ? 5 : 1;
}
// Spielposition nach dem Wechsel. Ausnahme Läufer 1 (L1) nach eigener Annahme:
// vorne kein Wechsel – Diagonal bleibt auf IV, Außen auf II, Mitte auf III.
// Wechselregel pro Team: 'pro' = alle wechseln, 'jugend' = nur Vorderspieler und Zuspiel
const sysOf = t => (t && t.sys) || 'pro';
const SYS = {pro:'Obere Ligen: alle wechseln auf Spezialpositionen (3er-Annahme)', jugend:'Jugend: nur Vorderspieler und Zuspiel wechseln (4er-Annahme)'};
function specZoneFor(st, t, id, zone){
  const front = zone >= 2 && zone <= 4;
  if (front && st.serve === 'them' && rotOfState(st) === 1) return zone;
  if (!front && sysOf(t) === 'jugend') {
    // hinten wechselt nur die Zuspielerin auf I; wer auf I steht, tauscht mit ihr
    if (posOf(t, id) === 'Z') return 1;
    if (zone === 1) {
      const sz = courtLineup(st, t).findIndex(x => posOf(t, x) === 'Z') + 1;
      if ([5,6].includes(sz)) return sz;
    }
    return zone;
  }
  return specZone(id === st.libId ? 'L' : roleOf(t, id), front);
}
// Libero ersetzt automatisch die Mitte in der hinteren Reihe – außer wenn sie auf I aufschlägt
function liberoFor(st, t){
  if (!st.libId || !st.lineup) return null;
  for (const i of [0,4,5]) {
    const id = st.lineup[i];
    if (roleOf(t, id) === 'MB') return (i === 0 && st.serve === 'us') ? null : id;
  }
  return null;
}
function courtLineup(st, t){
  const f = liberoFor(st, t);
  return st.lineup.map(id => id === f ? st.libId : id);
}
const phaseOf = st => st.rallyFresh ? (st.serve === 'us' ? 'serve' : 'recv') : 'spec';
function formation(st, t){
  const cl = courtLineup(st, t), std = isStd51(st.lineup, t), rot = rotOfState(st), ph = phaseOf(st);
  return cl.map((id, i) => {
    const zone = i + 1, front = zone >= 2 && zone <= 4;
    let xy;
    if (ph === 'serve' && zone === 1) xy = SERVER_SPOT;
    else if (!std) xy = SPOT[zone];
    else if (ph === 'recv') xy = (sysOf(t) === 'jugend' ? REC4 : REC)[rot][zone];
    else xy = SPOT[specZoneFor(st, t, id, zone)];
    return {id, zone, xy};
  });
}
function rotOfState(st){
  const i = st.lineup ? st.lineup.indexOf(st.ref) : -1;
  return i >= 0 ? i + 1 : null;
}

/* ---------- Spiellogik: alle Ereignisse neu abspielen ---------- */
function replay(m){
  const t = team(m.teamId);
  const st = {set:0, us:0, them:0, setsUs:0, setsThem:0, lineup:null, serve:null,
    libId:null, ref:null, setOver:false, matchOver:false,
    rallyFresh:true, rec:null, att:false, setScores:[], ri:0};
  const ann = [], rallies = [];
  const rotate = () => { const o = st.lineup; st.lineup = o.map((_, i) => o[(i + 1) % 6]); };
  const award = (w, a) => {
    a.win = w;
    const rl = {set:a.set, rot:a.rot, serve:a.serve, win:w, ri:st.ri++, us0:a.us, them0:a.them, by:a.t === 'act' ? a : null};
    rallies.push(rl);
    if (w === 'us') { st.us++; if (st.serve === 'them') { rotate(); st.serve = 'us'; } }
    else { st.them++; st.serve = 'them'; }
    rl.us1 = a.us1 = st.us; rl.them1 = a.them1 = st.them;
    st.rallyFresh = true; st.rec = null; st.att = false; st.pendSet = null; st.fromRec = false; st.fromDig = false;
    const tgt = st.set === 5 ? 15 : 25;
    if ((st.us >= tgt || st.them >= tgt) && Math.abs(st.us - st.them) >= 2) {
      st.setOver = true;
      st.setScores.push([st.us, st.them]);
      if (st.us > st.them) st.setsUs++; else st.setsThem++;
      if (st.setsUs === 3 || st.setsThem === 3) st.matchOver = true;
    }
  };
  for (const ev of m.events) {
    const a = {...ev, set:st.set, us:st.us, them:st.them, serve:st.serve, rot:st.lineup ? rotOfState(st) : null, ri:st.ri};
    switch (ev.t) {
      case 'set':
        Object.assign(st, {set:st.set + 1, us:0, them:0, lineup:ev.lineup.slice(), serve:ev.serve,
          libId:ev.lib || null, ref:ev.ref, setOver:false, rallyFresh:true, rec:null, att:false});
        a.set = st.set; a.us = 0; a.them = 0;
        break;
      case 'sub': {
        const i = st.lineup.indexOf(ev.out);
        if (i >= 0) st.lineup[i] = ev.in;
        if (st.ref === ev.out) st.ref = ev.in;
        break;
      }
      case 'act': {
        const i = courtLineup(st, t).indexOf(ev.p);
        a.zone = i >= 0 ? i + 1 : null;
        // Spielposition (für Angriffsverteilung): nach Wechsel auf Spezialpositionen
        a.pz = a.zone;
        if (a.zone && phaseOf(st) === 'spec' && isStd51(st.lineup, t))
          a.pz = specZoneFor(st, t, ev.p, a.zone);
        // tatsächlicher Ort aus der aktuellen Formation: links = 5, Mitte = 6, rechts = 1
        const laneOf = id => { const f = formation(st, t).find(x => x.id === id); return f ? (f.xy[0] < 1/3 ? 5 : f.xy[0] < 2/3 ? 6 : 1) : null; };
        if (ev.s === 'R') { st.rec = ev.r; st.fromRec = true; st.fromDig = false; st.recLane = laneOf(ev.p); a.recLane = st.recLane; }
        if (ev.s === 'D') { st.fromDig = true; st.digLane = laneOf(ev.p); a.digLane = st.digLane; }
        // Zuspiel direkt aus der Annahme (Side-out) oder aus Abwehr/Block (Transition)
        if (ev.s === 'E') {
          a.recQ = st.fromRec ? st.rec : null; a.recLane = st.fromRec ? st.recLane : null;
          a.digLane = !st.fromRec && st.fromDig ? st.digLane : null;
        }
        if (ev.s === 'A' || ev.s === 'D' || ev.s === 'B') st.fromRec = false;
        if (ev.s === 'A' || ev.s === 'B') st.fromDig = false;
        if (ev.s === 'A') {
          a.recQ = st.rec; a.firstAtt = !st.att; st.att = true;
          // Zuspiel mit dem folgenden Angriff verknüpfen
          if (st.pendSet) { a.setBy = st.pendSet.p; a.setQ = st.pendSet.r; st.pendSet.attPz = a.pz ?? a.zone; st.pendSet.attR = a.r; }
          st.pendSet = null;
        } else if (ev.s === 'E') st.pendSet = a;
        else st.pendSet = null;
        st.rallyFresh = false;
        const w = (POINT[ev.s] || {})[ev.r];
        if (w) award(w, a);
        break;
      }
      case 'libOff': st.libId = null; break;
      case 'pt':
        award(ev.w, a);
        break;
      // 'lib' / 'libout' aus älteren Versionen: Libero wird jetzt automatisch geführt
    }
    ann.push(a);
  }
  return {st, ann, rallies};
}

/* ---------- Rendering ---------- */
const TABS = [['live','Live'],['matches','Spiele'],['teams','Teams'],['stats','Statistik'],['data','Daten']];
const $app = document.getElementById('app');

/* ----- Teams ----- */
function posOptions(sel){
  return Object.entries(POS).map(([k,l]) => `<option value="${k}" ${sel === k ? 'selected' : ''}>${l}</option>`).join('');
}

        <td><button class="danger" data-act="delPlayer" data-id="${p.id}">✕</button></td></tr>`).join('')}
      <tr><td><input id="npNum" type="number" class="w4" placeholder="Nr."></td>
        <td style="text-align:left"><input id="npName" placeholder="Name"></td>
        <td style="text-align:left"><select id="npPos">${posOptions('AA')}</select></td>
        <td><button class="primary" data-act="addPlayer">Hinzufügen</button></td></tr>
      </tbody></table></div></div>`;

/* ----- Spiele ----- */
function resultOf(m){
  const {st} = replay(m);
  return st.setsUs + ':' + st.setsThem + (st.setScores.length ? ' (' + st.setScores.map(s => s.join(':')).join(', ') + ')' : '');
}
function vMatches(){
  if (!db.teams.length) return `<div class="card">Lege zuerst unter <b>Teams</b> ein Team mit Spielern an.</div>`;
  const list = db.matches.slice().sort((a,b) => (b.date || '').localeCompare(a.date || ''));
  return `<div class="card"><h2>Neues Spiel</h2>
    <div class="row">
      <select id="nmTeam">${db.teams.map(t => `<option value="${t.id}">${esc(t.name)}</option>`).join('')}</select>
      <input id="nmOpp" placeholder="Gegner">
      <input id="nmDate" type="date" value="${today()}">
      <button class="primary" data-act="addMatch">Spiel anlegen</button>
    </div></div>
    <div class="card"><h2>Spiele</h2>
    ${list.length ? `<div class="tblwrap"><table class="tbl"><thead><tr><th>Datum</th><th style="text-align:left">Team</th><th style="text-align:left">Gegner</th><th>Ergebnis</th><th>Status</th><th></th></tr></thead><tbody>
    ${list.map(m => { const t = team(m.teamId); return `<tr><td>${fmtDate(m.date)}</td><td style="text-align:left">${esc(t ? t.name : '?')}</td><td style="text-align:left">${esc(m.opponent)}</td><td>${resultOf(m)}</td><td>${m.finished ? 'beendet' : 'offen'}</td>
      <td><div class="row" style="justify-content:flex-end"><button data-act="openMatch" data-id="${m.id}">Scouten</button><button data-act="statsMatch" data-id="${m.id}">Statistik</button><button class="danger" data-act="delMatch" data-id="${m.id}">✕</button></div></td></tr>`; }).join('')}
    </tbody></table></div>` : '<span class="muted">Noch keine Spiele.</span>'}</div>`;
}

/* ----- Live ----- */
function vLive(){
  const m = match(ui.matchId);
  if (!m) return `<div class="card">Kein Spiel geöffnet. Lege unter <b>Spiele</b> ein Spiel an oder öffne eines.</div>`;
  const t = team(m.teamId);
  if (!t) return `<div class="card">Das Team dieses Spiels wurde gelöscht.</div>`;
  const R = replay(m), st = R.st;
  const head = `<div class="row" style="justify-content:space-between;margin-bottom:10px"><div><b>${esc(t.name)}</b> vs. <b>${esc(m.opponent)}</b> <span class="muted">· ${fmtDate(m.date)}</span></div>
    <div class="row noprint">${m.events.length ? '<button data-act="undo">↶ Rückgängig</button>' : ''}<button data-act="finish">${m.finished ? 'Spiel wieder öffnen' : 'Spiel beenden'}</button></div></div>`;
  if (m.finished) return head + `<div class="card"><h2>Spiel beendet: ${resultOf(m)}</h2><button class="primary" data-act="statsMatch" data-id="${m.id}">Zur Statistik</button></div>`;
  if (st.matchOver) return head + `<div class="card"><h2>Spiel vorbei: ${resultOf(m)}</h2><p class="muted">Letzten Punkt falsch? Mit „Rückgängig“ korrigieren.</p><button class="primary" data-act="finish">Spiel beenden</button></div>`;
  if (st.set === 0 || st.setOver) return head + vSetup(m, t, st);

  // Vorauswahl zu Beginn jedes Ballwechsels
  if (ui.preKey !== m.events.length) {
    ui.preKey = m.events.length;
    if (st.rallyFresh && !ui.mode) {
      if (st.serve === 'us') { ui.selP = st.lineup[0]; ui.selS = 'S'; }
      else { ui.selP = null; ui.selS = 'R'; }
    }
  }
  const onCourt = new Set(courtLineup(st, t));
  const bench = t.players.filter(p => !onCourt.has(p.id) && p.id !== st.libId).sort((a,b) => a.num - b.num);
  let hint = '';
  if (ui.mode === 'sub') hint = ui.subOut ? `Wechsel: ${esc(pname(t, ui.subOut))} geht raus – jetzt Bankspieler antippen` : 'Wechsel: Spieler auf dem Feld antippen, der rausgeht';

  const ph = phaseOf(st), std = isStd51(st.lineup, t), rot = rotOfState(st);
  const top = y => ((y + 0.05) / 1.25 * 100).toFixed(1) + '%';
  // nur Anzeige: überlappende Spielfiguren auseinanderschieben (Figur ≈ 0,23 breit, 0,175 hoch in Feldkoordinaten)
  const F = formation(st, t).map(f => ({...f, xy: [Math.min(.88, Math.max(.12, f.xy[0])), f.xy[1]]}));
  for (let it = 0; it < 20; it++) {
    let moved = false;
    for (let i = 0; i < F.length; i++) for (let j = i + 1; j < F.length; j++) {
      const a = F[i].xy, b = F[j].xy, dx = b[0] - a[0], dy = b[1] - a[1];
      if (Math.abs(dx) < .235 && Math.abs(dy) < .18) {
        const sh = (.18 - Math.abs(dy)) / 2 + .002, sg = dy >= 0 ? 1 : -1;
        F[i].xy = [a[0], a[1] - sg * sh]; F[j].xy = [b[0], b[1] + sg * sh]; moved = true;
      }
    }
    if (!moved) break;
  }
  const tokens = F.map(({id, zone, xy}) => {
    const p = playerOf(t, id);
    const cls = ['tok', (ui.mode === 'sub' ? ui.subOut === id : ui.selP === id) ? 'sel' : '', id === st.libId ? 'lib' : ''].join(' ');
    return `<button class="${cls}" style="left:${(Math.min(.88, Math.max(.12, xy[0])) * 100).toFixed(1)}%;top:${top(xy[1])}" data-act="selP" data-id="${id}"><span class="zn">${ZN[zone - 1]}</span><span class="num">${p ? p.num : '?'}</span><span class="nm">${esc(p ? p.name : '')}</span></button>`;
  }).join('');
  const phaseTxt = !std ? 'Rotationspositionen – keine Standard-5-1-Aufstellung (Z–AA–MB–D–AA–MB) erkannt'
    : ph === 'recv' ? (sysOf(t) === 'jugend' ? `4er-Annahme L${rot}` : `Annahme-Formation L${rot}`)
    : ph === 'serve' ? (sysOf(t) === 'jugend' ? 'Eigener Aufschlag – Vorderspielerinnen und Zuspielerin stehen bereits auf ihren Positionen' : 'Eigener Aufschlag – Spieler stehen bereits auf Spezialpositionen')
    : (st.serve === 'them' && rot === 1) ? 'Spezialpositionen nach Annahme L1 – vorne kein Wechsel (Diagonal IV, Außen II)' : 'Spezialpositionen';
  const courtHtml = `<div class="half"><div class="nt">NETZ</div><div class="fl"></div><div class="al"></div>${tokens}</div><div class="phase muted">${phaseTxt} · römische Ziffer = Rotationszone</div>`;

  const canRate = ui.selP && ui.selS && !ui.mode;
  const labels = RL[ui.selS] || RL.E;
  const n = R.ann.length;

function logText(a, t){
  const sc = `<span class="muted">${a.us}:${a.them}</span> `;
  const win = a.win ? ` → <span class="w-${a.win}">Punkt ${a.win === 'us' ? 'wir' : 'Gegner'}</span>` : '';
  switch (a.t) {
    case 'set': return `<b>Satz ${a.set} gestartet</b>`;
    case 'act': return sc + `${esc(pname(t, a.p))} · ${SK[a.s]} <b>${esc(a.r)}</b>${trajOf(a) ? ' ↗' : ''}` + win;
    case 'pt': return sc + 'Punkt ohne Aktion' + win;
    case 'libOff': return sc + '<b>Libero-Automatik aus</b> – Libero nur noch per Wechsel';
    case 'sub': return sc + `Wechsel: ${esc(pname(t, a.in))} für ${esc(pname(t, a.out))}`;
    case 'lib': return sc + `Libero für ${esc(pname(t, a.out))}`;
    case 'libout': return sc + 'Libero raus';
  }
  return '';
}
function vSetup(m, t, st){
  const prev = m.events.filter(e => e.t === 'set').slice(-1)[0];

    ps.map(p => `<option value="${p.id}" ${sel === p.id ? 'selected' : ''}>#${p.num} ${esc(p.name)} (${POS[p.pos] || ''})</option>`).join('');
  const lu = prev ? prev.lineup : [];

/* ----- Statistik ----- */
function evalList(s, list){
  const c = {'#':0,'+':0,'!':0,'-':0,'/':0,'=':0};
  list.forEach(a => c[a.r]++);
  const n = list.length;
  let eff;
  if (s === 'A' || s === 'B') eff = c['#'] - c['/'] - c['='];
  else if (s === 'R') eff = c['#'] + c['+'] - c['/'] - c['='];
  else eff = c['#'] - c['='];
  return {n, c, pos: pct(c['#'] + c['+'], n), perf: pct(c['#'], n), eff: pct(eff, n)};
}
function statData(){
  const f = ui.f, t = team(f.team);
  if (!t) return null;
  const ms = db.matches.filter(m => m.teamId === t.id && (f.match === 'all' || m.id === f.match));
  let acts = [], rallies = [], log = [];
  ms.forEach(m => {
    const R = replay(m), rw = {};
    R.rallies.forEach(r => { rw[r.ri] = r.win; });
    R.ann.forEach(a => { if (a.t === 'act') acts.push({...a, mid:m.id, rwin:rw[a.ri] || null}); if (a.t === 'act' || a.t === 'pt') log.push({...a, mid:m.id}); });
    R.rallies.forEach(r => rallies.push({...r, mid:m.id}));
  });
  const ok = x => (f.set === 'all' || x.set === +f.set) && (f.rot === 'all' || x.rot === +f.rot);
  const setRallies = rallies.filter(x => f.set === 'all' || x.set === +f.set);
  acts = acts.filter(ok); rallies = rallies.filter(ok); log = log.filter(ok);
  const actsP = f.player === 'all' ? acts : acts.filter(a => a.p === f.player);
  const pids = [...new Set(acts.map(a => a.p))].sort((a,b) => ((playerOf(t,a)||{num:999}).num) - ((playerOf(t,b)||{num:999}).num));
  const by = (p, s) => acts.filter(a => a.p === p && a.s === s);
  const tables = [];

  // Übersicht
  tables.push({title:'Übersicht', head:['Spieler','Punkte','Fehler','Aufschläge','Asse','Aufschl.-Fehler','Aufschl.-Eff.','Annahmen','Ann. pos.','Ann. perf.','Angriffe','Angr.-Punkte','Angr.-Eff.','Block-Punkte','Abwehr','Abw. pos.'],
    rows: [...pids.map(p => [pname(t,p), ...ovRow(acts.filter(a => a.p === p))]), ['Team', ...ovRow(acts)]], totalLast:true});

  // Details je Element (alle sechs)
  const details = SKILLS.map(s => {
    const detRow = list => { const e = evalList(s, list); return [e.n, ...RT.map(r => e.c[r]), e.pos, e.perf, e.eff]; };
    return {title: SK[s] + ' Details', skill: s, head:['Spieler','Gesamt', ...RT.map((r,i) => r + ' ' + RL[s][i]), 'positiv','perfekt','Effizienz'],
      rows: [...pids.filter(p => by(p,s).length).map(p => [pname(t,p), ...detRow(by(p,s))]), ['Team', ...detRow(acts.filter(a => a.s === s))]], totalLast:true};
  });
  tables.push(...details);

  // Rotationen
  const rotRow = list => {
    const so = list.filter(r => r.serve === 'them'), br = list.filter(r => r.serve === 'us');
    const won = list.filter(r => r.win === 'us').length;
    return [list.length, won, list.length - won, pct(so.filter(r => r.win === 'us').length, so.length) + ' (' + so.length + ')', pct(br.filter(r => r.win === 'us').length, br.length) + ' (' + br.length + ')'];
  };
  tables.push({title:'Läufer', head:['Läufer','Ballwechsel','gewonnen','verloren','Side-out (bei Gegner-Aufschlag)','Break (bei eigenem Aufschlag)'],
    rows: [...[1,2,3,4,5,6].map(r => ['L' + r, ...rotRow(rallies.filter(x => x.rot === r))]), ['Gesamt', ...rotRow(rallies)]], totalLast:true});
  tables.push(serveZoneTable(acts.filter(a => a.s === 'S')));

  // Angriffsverteilung
  const att = acts.filter(a => a.s === 'A');
  const good = att.filter(a => a.firstAtt && (a.recQ === '#' || a.recQ === '+'));
  const weak = att.filter(a => a.firstAtt && (a.recQ === '!' || a.recQ === '-'));
  const zp = a => a.pz ?? a.zone;
  const zoneGroups = [['Position IV', a => zp(a) === 4], ['Position III', a => zp(a) === 3], ['Position II', a => zp(a) === 2], ['Hinten (I, V, VI)', a => [1,5,6].includes(zp(a))]];
  const share = (list, fn) => { const k = list.filter(fn).length; return k + ' (' + pct(k, list.length) + ')'; };
  tables.push({title:'Angriffsverteilung', head:['Angriff von','Alle Angriffe','nach Annahme # / +','nach Annahme ! / -','Effizienz'],
    rows: [...zoneGroups.map(([l, fn]) => [l, share(att, fn), share(good, fn), share(weak, fn), evalList('A', att.filter(fn)).eff]),
      ['Gesamt', att.length, good.length, weak.length, evalList('A', att).eff]], totalLast:true});
  tables.push({title:'Angriffe nach Spieler', head:['Spieler','Anteil Angriffe','Punkte','Effizienz'],
    rows: pids.filter(p => by(p,'A').length).map(p => { const l = by(p,'A'); return [pname(t,p), l.length + ' (' + pct(l.length, att.length) + ')', l.filter(a => a.r === '#').length, evalList('A', l).eff]; })});

  // Angriff nach Zuspielqualität je Angreifer (+ Team)
  tables.push(attBySetTable(t, acts, null));
  pids.filter(p => by(p, 'A').length).forEach(p => tables.push(attBySetTable(t, acts, p)));

  // Zuspiel → Angriff je Zuspieler
  const setters = pids.filter(p => by(p, 'E').length);
  setters.forEach(p => tables.push(...setterTables(t, acts, p, zoneGroups)));
  return {t, ms, acts, actsP, rallies, setRallies, log, tables, pids, details, zoneGroups, setters, filterTxt: filterText(t)};
}
// Zuspiel-Auswertung: wohin wurde zugespielt (Angriffsposition) und wie gut war der Angriff danach.
// p = Zuspieler-ID oder null für das ganze Team
function setterTables(t, acts, p, zoneGroups){
  const sets = acts.filter(a => a.s === 'E' && (p == null || a.p === p));
  const att = acts.filter(a => a.s === 'A' && a.setBy != null && (p == null || a.setBy === p));
  const who = p == null ? 'Team' : pname(t, p);
  const zp = a => a.pz ?? a.zone;
  const good = att.filter(a => a.setQ === '#' || a.setQ === '+'), weak = att.filter(a => a.setQ === '!' || a.setQ === '-' || a.setQ === '/');
  const share = (list, fn) => { const k = list.filter(fn).length; return k + ' (' + pct(k, list.length) + ')'; };
  const dist = {title: 'Zuspielverteilung ' + who, head:['Angriff von','Zuspiele mit Angriff','nach Zuspiel # / +','nach Zuspiel ! / - / /','Angriffs-Punkte','Angriffs-Eff.'],
    rows: [...zoneGroups.map(([l, fn]) => { const z = att.filter(fn); return [l, share(att, fn), share(good, fn), share(weak, fn), z.filter(a => a.r === '#').length, evalList('A', z).eff]; }),
      ['Gesamt', att.length, good.length, weak.length, att.filter(a => a.r === '#').length, evalList('A', att).eff],
      ['Zuspiele ohne erfassten Angriff', sets.length - att.length, '', '', '', '']], totalLast:false};
  const posName = z => z === 4 ? 'IV' : z === 3 ? 'III' : z === 2 ? 'II' : z ? 'hinten' : '';
  const qual = {title: 'Zuspielqualität → Angriff ' + who, head:['Zuspiel','Zuspiele','mit Angriff','Angriffs-Punkte','geblockt / Fehler','Angriffs-Eff.','häufigste Position'],
    rows: RT.map((r, i) => {
      const n = sets.filter(a => a.r === r).length, l = att.filter(a => a.setQ === r);
      const cnt = {}; l.forEach(a => { const k = posName(zp(a)); cnt[k] = (cnt[k] || 0) + 1; });
      const top = Object.entries(cnt).sort((x, y) => y[1] - x[1])[0];
      return [r + ' ' + RL.E[i], n, l.length, l.filter(a => a.r === '#').length, l.filter(a => a.r === '/' || a.r === '=').length, evalList('A', l).eff, top ? top[0] + ' (' + top[1] + ')' : '–'];
    })};
  const byRot = {title: 'Zuspielverteilung nach Läufer ' + who, head:['Läufer','Zuspiele mit Angriff', ...zoneGroups.map(([l]) => l.replace('Position ', '')), 'Angriffs-Punkte', 'Angriffs-Eff.'],
    rows: [...[1,2,3,4,5,6].map(r => {
      const l = att.filter(a => a.rot === r);
      return ['L' + r, l.length, ...zoneGroups.map(([, fn]) => { const k = l.filter(fn).length; return k ? k + ' (' + pct(k, l.length) + ')' : '–'; }), l.filter(a => a.r === '#').length, evalList('A', l).eff];
    }), ['Gesamt', att.length, ...zoneGroups.map(([, fn]) => { const k = att.filter(fn).length; return k + ' (' + pct(k, att.length) + ')'; }), att.filter(a => a.r === '#').length, evalList('A', att).eff]], totalLast:true};
  // Kette Annahme → Zuspiel → Position → Angriff
  const chainRow = (label, list) => {
    const withA = list.filter(x => x.attR);
    const cell = fn => { const z = withA.filter(x => fn({pz: x.attPz})); return z.length ? z.length + ' · ' + evalList('A', z.map(x => ({r: x.attR}))).eff : '–'; };
    const E = evalList('E', list);
    return [label, list.length, E.pos, E.eff, ...zoneGroups.map(([, fn]) => cell(fn)), withA.length, evalList('A', withA.map(x => ({r: x.attR}))).eff];
  };
  const chain = {title: 'Annahme → Zuspiel → Angriff ' + who,
    head:['Ausgangslage','Zuspiele','Zuspiel pos.','Zuspiel-Eff.', ...zoneGroups.map(([l]) => (l.startsWith('Hinten') ? 'hinten' : l.replace('Position ', '')) + ' (n · Eff.)'), 'Angriffe','Angriffs-Eff.'], narrow:true,
    rows: [...['#','+','!','-','/'].map((q, i) => chainRow('Annahme ' + q + ' ' + RL.R[RT.indexOf(q)], sets.filter(x => x.recQ === q))),
      chainRow('Transition', sets.filter(x => x.recQ == null)),
      chainRow('Gesamt', sets)], totalLast:true};
  // kurze Blattnamen für Excel (max. 31 Zeichen)
  const sw = p == null ? 'Team' : ('#' + ((playerOf(t, p) || {}).num ?? '?') + ' ' + ((playerOf(t, p) || {}).name || '')).trim();
  dist.sheet = ('Zusp-Verteilung ' + sw).slice(0, 31);
  byRot.sheet = ('Zusp-Läufer ' + sw).slice(0, 31);
  qual.sheet = ('Zusp-Qualität ' + sw).slice(0, 31);
  chain.sheet = ('Ann-Zusp-Angr ' + sw).slice(0, 31);
  // Annahmeort (5 | 6 | 1) → Zuspiel → Angriffsposition, als Tabelle und Pfeilgrafik
  const lanes = [5, 6, 1];
  const laneT = {title: 'Annahmeort → Zuspiel → Angriff ' + who, narrow:true,
    head:['Annahme von','Zuspiele','Zuspiel pos.', ...zoneGroups.map(([l]) => (l.startsWith('Hinten') ? 'hinten' : l.replace('Position ', '')) + ' (n · Eff.)'), 'Angriffs-Eff.'],
    rows: lanes.map(L => { const r = chainRow('Position ' + L, sets.filter(x => x.recLane === L)); return [r[0], r[1], r[2], ...r.slice(4, 8), r[9]]; })};
  laneT.graphic = laneGraphic(sets, zoneGroups, 'recLane', 'Annahme von', 'Annahmeort');
  laneT.sheet = ('Ann-Ort ' + sw).slice(0, 31);
  const nRec = sets.filter(x => x.recQ != null).length, nTr = sets.length - nRec, nDig = sets.filter(x => x.digLane).length;
  laneT.note = `${sets.length} Zuspiele: ${nRec} direkt nach eigener Annahme (hier nach Annahmeort), ${nTr} in der Transition (eigene Grafik unten).`;
  // Transition: Abwehrort (5 | 6 | 1) → Zuspiel → Angriffsposition
  const digT = {title: 'Abwehrort → Zuspiel → Angriff (Transition) ' + who, narrow:true,
    head: laneT.head.map((h, i) => i === 0 ? 'Abwehr von' : h),
    rows: [...lanes.map(L => { const r = chainRow('Position ' + L, sets.filter(x => x.digLane === L)); return [r[0], r[1], r[2], ...r.slice(4, 8), r[9]]; }),
      (() => { const r = chainRow('ohne erfasste Abwehr', sets.filter(x => x.recQ == null && !x.digLane)); return [r[0], r[1], r[2], ...r.slice(4, 8), r[9]]; })()]};
  digT.graphic = laneGraphic(sets, zoneGroups, 'digLane', 'Abwehr von', 'Abwehrort');
  digT.note = `${nTr} Transition-Zuspiele: ${nDig} nach eigener Abwehr (hier nach Abwehrort), ${nTr - nDig} ohne erfasste Abwehr davor (z. B. nach Block, Freeball oder abgewehrtem eigenem Angriff).`;
  digT.sheet = ('Abw-Ort ' + sw).slice(0, 31);
  return [dist, byRot, qual, chain, laneT, digT];
}
// Angriffe eines Angreifers (bzw. des Teams) nach der Qualität des vorherigen Zuspiels
function attBySetTable(t, acts, p){

  const sw = p == null ? 'Team' : ('#' + ((playerOf(t, p) || {}).num ?? '?') + ' ' + ((playerOf(t, p) || {}).name || '')).trim();
  const row = (label, l) => { const e = evalList('A', l); return [label, e.n, ...RT.map(r => e.c[r]), pct(e.c['#'], e.n), e.eff]; };
  return {title: 'Angriff nach Zuspielqualität ' + who, sheet: ('Angr-Zusp ' + sw).slice(0, 31), narrow: true,
    head: ['Zuspiel', 'Angriffe', '# Punkt', '+ Gut', '! Abgewehrt', '- Schlecht', '/ Geblockt', '= Fehler', 'Kill-Quote', 'Effizienz'],
    rows: [...['#','+','!','-','/'].map(q => row(q + ' ' + RL.E[RT.indexOf(q)], A.filter(a => a.setQ === q))),
      row('ohne erfasstes Zuspiel', A.filter(a => !a.setQ)), row('Gesamt', A)], totalLast: true};
}

const DEFS_HTML = `<div class="card small muted"><b>Definitionen:</b> positiv = (# + +) / Gesamt · perfekt = # / Gesamt ·

// Aufschlag-Zielzonen im 9-Zonen-System (Sicht des Gegners): tief 1·6·5, halblang 9·8·7, am Netz 2·3·4 – je 3 m
const SZ_ORDER = ['1','6','5','9','8','7','2','3','4'];
function serveZone(a){
  const l = trajOf(a); if (!l || l[2] == null) return null;
  const x = l[2], y = l[3] * 18; // y: 0 = gegnerische Grundlinie, 9 = Netz
  if (x < 0 || x > 1 || y < 0 || y > 9) return 'aus';
  const c = x < 1/3 ? 0 : x < 2/3 ? 1 : 2;
  return (y < 3 ? ['1','6','5'] : y < 6 ? ['9','8','7'] : ['2','3','4'])[c];
}
function szStats(list){
  const c = r => list.filter(a => a.r === r).length, br = list.filter(a => a.rwin === 'us').length;
  return {n: list.length, ace: c('#'), plus: c('+'), perf: c('/'), err: c('='), br, q: list.length ? br / list.length : null};
}
function serveZoneTable(serves, title){
  const inField = serves.filter(a => SZ_ORDER.includes(serveZone(a)));
  const row = (lab, l, share) => { const z = szStats(l); return [lab, z.n, share ? pct(z.n, inField.length) : '', z.ace, z.plus, z.perf, z.err, z.n ? pct(z.br, z.n) + ' (' + z.br + ')' : '–']; };
  const rows = SZ_ORDER.map(z => row('Zone ' + z, serves.filter(a => serveZone(a) === z), true));
  rows.push(row('Aus / Netz', serves.filter(a => serveZone(a) === 'aus')));
  const none = serves.filter(a => serveZone(a) === null); if (none.length) rows.push(row('ohne Zielpunkt', none));
  rows.push(row('Gesamt', serves));
  return {title: title || 'Aufschlag nach Zielzone (9 Zonen)', sheet: 'Aufschlag-Zonen', head: ['Zielzone','Aufschläge','Anteil im Feld','Ass','+ Druck','/ perfekte Gegnerannahme','Fehler','Break (Ballwechsel gewonnen)'], rows, totalLast: true};
}

let pdfBusy = false;
async function exportPlayerPdfs(){
  if (pdfBusy) return;
  const D = statData(); if (!D || !D.pids.length) { alert('Keine Spieler mit Aktionen für die gewählten Filter.'); return; }
  const prog = msg => { const el = document.getElementById('pdfProg'); if (el) el.textContent = ' ' + msg; };
  pdfBusy = true;
  try {
    prog('Lade PDF-Bausteine …');
    try { await pdfLibs(); } catch (e) { alert('PDF-Bausteine konnten nicht geladen werden (libs/ fehlt und keine Internetverbindung).'); return; }
    const W = 1400, MM_W = 297 - 16, MM_H = 210 - 16, PAGE_H = Math.floor(W * MM_H / MM_W);
    const box = document.createElement('div'); box.className = 'pdfcap';
    box.style.cssText = `position:absolute;left:-20000px;top:0;width:${W}px;padding:0;`;
    document.body.appendChild(box);
    const files = [];
    for (let i = 0; i < D.pids.length; i++) {
      const p = D.pids[i], pl = playerOf(D.t, p) || {};
      prog(`PDF ${i + 1} von ${D.pids.length}: ${pname(D.t, p)} …`);
      box.innerHTML = playerSectionHtml(D, p, '');
      await new Promise(r => setTimeout(r, 30));
      await svgsToImages(box); // html2canvas zeichnet Inline-SVGs unzuverlässig → vorher in Bilder umwandeln
      const sec = box.firstElementChild, totalH = box.scrollHeight;
      // Seitenumbrüche an Blockgrenzen (Überschrift, Absatz, Karte)
      const pages = []; let start = 0;
      for (const b of sec.children) {
        const top = b.offsetTop, bottom = top + b.offsetHeight;
        if (bottom - start > PAGE_H) {
          if (top > start) { pages.push([start, top]); start = top; }
          while (bottom - start > PAGE_H) { pages.push([start, start + PAGE_H]); start += PAGE_H; }
        }
      }
      pages.push([start, totalH]);
      const SC = 2;
      const canvas = await html2canvas(box, {scale: SC, backgroundColor: '#ffffff', width: W, windowWidth: W, logging: false});
      const pdf = new window.jspdf.jsPDF({orientation: 'landscape', unit: 'mm', format: 'a4'});
      pages.forEach(([a, b], k) => {
        const h = Math.max(1, b - a), c = document.createElement('canvas');
        c.width = W * SC; c.height = Math.ceil(h * SC);
        const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height);
        g.drawImage(canvas, 0, a * SC, W * SC, h * SC, 0, 0, W * SC, h * SC);
        if (k) pdf.addPage();
        pdf.addImage(c.toDataURL('image/jpeg', 0.92), 'JPEG', 8, 8, MM_W, MM_W * h / W);
        pdf.setFontSize(8); pdf.setTextColor(140);
        pdf.text(`${pname(D.t, p)} · ${D.t.name} · ${D.filterTxt} · Seite ${k + 1}/${pages.length}`, 148.5, 205, {align: 'center'});
      });
      const fn = ('Einzelbericht ' + (pl.num ?? '') + ' ' + (pl.name || 'Spieler')).trim().replace(/[\\/:*?"<>|#]+/g, '').replace(/\s+/g, '_') + '.pdf';
      files.push([fn, pdf.output('arraybuffer')]);
    }
    box.remove();
    prog('ZIP wird erstellt …');
    download('Einzelberichte-' + D.t.name.replace(/[^\w-]+/g, '_') + '-' + today() + '.zip', zip(files, 'application/zip'));
    prog(`Fertig: ${files.length} PDFs.`);
  } catch (e) { alert('PDF-Export fehlgeschlagen: ' + e.message); prog(''); }
  finally { pdfBusy = false; const b = document.querySelector('.pdfcap'); if (b) b.remove(); }
}
/* ---------- Minimaler XLSX-Writer (ohne externe Bibliothek) ---------- */
const CRC_T = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();

function zip(files, type){ // files: [[name, string | ArrayBuffer | Uint8Array]] – unkomprimiert (STORE)
  const enc = new TextEncoder(), parts = [], central = [];

    const nb = enc.encode(name), data = typeof str === 'string' ? enc.encode(str) : new Uint8Array(str), crc = crc32(data);
    const h = new DataView(new ArrayBuffer(30));
    h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true); h.setUint16(8, 0, true);
    h.setUint32(14, crc, true); h.setUint32(18, data.length, true); h.setUint32(22, data.length, true); h.setUint16(26, nb.length, true);
    parts.push(new Uint8Array(h.buffer), nb, data);

    c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true);
    c.setUint32(16, crc, true); c.setUint32(20, data.length, true); c.setUint32(24, data.length, true); c.setUint16(28, nb.length, true);
    c.setUint32(42, off, true);
    central.push(new Uint8Array(c.buffer), nb);
    off += 30 + nb.length + data.length;
  }
  const cSize = central.reduce((s, x) => s + x.length, 0);
  const e = new DataView(new ArrayBuffer(22));
  e.setUint32(0, 0x06054b50, true); e.setUint16(8, files.length, true); e.setUint16(10, files.length, true);
  e.setUint32(12, cSize, true); e.setUint32(16, off, true);
  return new Blob([...parts, ...central, new Uint8Array(e.buffer)], {type: type || 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}
function makeXlsx(sheets){
  const x = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])).replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g, '');

  const used = new Set();
  const names = sheets.map(([n]) => { let b = n.replace(/[\\\/?*\[\]:]/g, ' ').slice(0, 31) || 'Tabelle', k = b, i = 2; while (used.has(k)) k = b.slice(0, 28) + ' ' + i++; used.add(k); return k; });

    ['[Content_Types].xml', '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>' +
      sheets.map((_, i) => `<Override PartName="/xl/worksheets/sheet${i + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('') + '</Types>'],
    ['_rels/.rels', '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>'],
    ['xl/workbook.xml', '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>' +
      names.map((n, i) => `<sheet name="${x(n)}" sheetId="${i + 1}" r:id="rId${i + 1}"/>`).join('') + '</sheets></workbook>'],
    ['xl/_rels/workbook.xml.rels', '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
      sheets.map((_, i) => `<Relationship Id="rId${i + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i + 1}.xml"/>`).join('') +

  });
  return zip(files);
}
